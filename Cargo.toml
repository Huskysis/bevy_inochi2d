[package]
name = "bevy_inochi2d"
version = "0.4.0"
edition = "2024"
description = "Renderizador independiente de Inochi2D impulsado por el backend wgpu de Bevy"
repository = "https://github.com/Huskysis/bevy_inochi2d"
license = "MIT OR Apache-2.0"
authors = ["Huskysis"]
keywords = ["bevy", "inochi2d", "rendering", "2d", "puppet"]
categories = ["rendering", "game-development", "graphics"]
exclude = ["assets/", "examples/"]

[features]
default = []
# Legacy INX/INP authoring-format loader: parses the authoring JSON and
# converts it in memory into the same INR shape the exporter produces
# (`inochi2d-parser/inr-export` - image decoding + mask-contour baking),
# then feeds it through the same conversion `.inr` files use.
inx = ["inochi2d-parser/inr-export"]

[dependencies]
inochi2d-parser = { version = "0.2.3", features = ["inr"] }
thiserror = { version = "2", default-features = false }
bytemuck = { version = "1.14", features = ["derive"] }
i_overlay = "7.0.0"
i_triangle = "0.45.0"

[dependencies.bevy]
version = "0.19"
default-features = false
features = [
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_render",
    "bevy_sprite_render",
    "bevy_sprite",
    "bevy_asset",
    "bevy_log",
]


[dev-dependencies]
bevy = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }