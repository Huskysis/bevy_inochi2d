[package]
name = "bevy_inochi2d"
version = "0.3.0"
edition = "2024"
description = "Renderizador independiente de Inochi2D impulsado por el backend wgpu de Bevy"
repository = "https://github.com/Huskysis/bevy_inochi2d"
license = "MIT OR Apache-2.0"
authors = ["Huskysis"]
keywords = ["bevy", "inochi2d", "rendering", "2d", "puppet"]
categories = ["rendering", "game-development", "graphics"]
exclude = ["assets/", "examples/"]

[features]
default = []
# Legacy INX/INP authoring-format loader (pulls in the parser + image decoders).
inx = ["dep:inochi2d-parser", "dep:bevy_image"]

[dependencies]
inochi2d-parser = { version = "0.1", optional = true }
thiserror = { version = "2", default-features = false }
bytemuck = { version = "1.14", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[dependencies.bevy]
version = "0.18"
default-features = false
features = [
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite_render",
    "bevy_sprite",
    "bevy_asset",
]

[dependencies.bevy_image]
version = "0.18"
default-features = false
features = ["png", "tga"]
optional = true


[dev-dependencies]
bevy = "0.18"
